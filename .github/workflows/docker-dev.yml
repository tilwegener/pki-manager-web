name: Docker Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to publish as dev
        required: true
        default: main
        type: string

permissions:
  contents: read

# All runs publish the same mutable tags; serialize them across source branches.
concurrency:
  group: docker-dev
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      sha: ${{ steps.images.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Select images available at this revision
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repository="${REPOSITORY,,}"
          owner="${OWNER,,}"
          matrix=$(jq -cn --arg repository "$repository" --arg owner "$owner" '{include: [
            {name: "backend", image: ($repository + "/backend"), context: ".", file: "docker/Dockerfile", target: "backend"},
            {name: "frontend", image: ($repository + "/frontend"), context: ".", file: "docker/Dockerfile", target: "frontend"},
            {name: "issuer", image: ($owner + "/pki-manager-issuer"), context: "k8s/issuer", file: "k8s/issuer/Dockerfile", target: ""}
          ]}')
          if [ -f scep/Dockerfile ]; then
            matrix=$(jq -c --arg repository "$repository" '.include += [
              {name: "scep", image: ($repository + "/scep"), context: ".", file: "scep/Dockerfile", target: ""}
            ]' <<< "$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Publish ${{ matrix.name }}:dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ matrix.image }}
          tags: type=raw,value=dev
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
      - name: Build and publish dev image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:3000/trpc' }}
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,scope=dev-${{ matrix.name }},mode=max
